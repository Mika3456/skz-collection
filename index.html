<style>

<div id="auth" class="authbox"><h1>SKZ Collection</h1><p class="note">クラウド同期を使うにはログインしてください。</p><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード（6文字以上）"><div class="authrow"><button class="primary" id="login">ログイン</button><button id="signup">新規登録</button></div><p class="note" id="authmsg"></p></div>

<dialog id="dlg"><form id="form"><h2>シーン登録</h2><input type="hidden" id="id"><div class="field"><label>タイトル *</label><input id="title" required></div><div class="field"><label>登場メンバー</label><div class="members" id="members"></div></div><div class="field"><label>シーン内容・検索用メモ</label><textarea id="description" rows="3"></textarea></div><div class="field"><label>ケミ</label><input id="chemistry"></div><div class="field"><label>タグ（カンマ区切り）</label><input id="tags"></div><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>保存方法</label><select id="sourceType"><option value="youtube">YouTube（URL）</option><option value="upload">スマホの動画を保存</option></select></div><div id="youtubeFields"><div class="field"><label>YouTube URL *</label><input id="url" type="url"></div><div class="field"><label>開始位置（例 12:34）</label><input id="start"></div><div class="field"><label>終了位置</label><input id="end"></div></div><div id="uploadFields" class="hidden"><div class="field"><label>動画ファイル</label><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime,video/*"><div class="note">X・Instagram等から保存した動画や自分で撮影した動画を選択できます。1ファイル50MBまで。</div><div id="uploadProgress" class="uploadProgress"></div></div></div><div class="field"><label>お気に入り</label><select id="favorite"><option value="false">通常</option><option value="true">★ お気に入り</option></select></div><div class="footer"><button type="button" onclick="dlg.close()">キャンセル</button><button class="primary" id="saveBtn">保存</button></div></form></dialog>
<dialog id="view"><div id="viewer"></div><div class="footer"><button onclick="view.close()">閉じる</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ncmratcovzofsygzqrpr.supabase.co";
const SUPABASE_KEY="sb_publishable_YNxtox2ToU23WY4fsYefQQ_KAme06Yh";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MS=["Bang Chan","Lee Know","Changbin","Hyunjin","HAN","Felix","Seungmin","I.N"];
let rs=[],mf="",fo=false,user=null,room=null,$=x=>document.getElementById(x);
function secs(v){return(v||"").split(":").reduce((n,x)=>n*60+(+x||0),0)}
function fmtSecs(n){if(n===null||n===undefined||n==="")return"";n=+n||0;let m=Math.floor(n/60),s=n%60;return m+":"+String(s).padStart(2,"0")}
function yid(u){try{let x=new URL(u);return x.hostname.includes("youtu.be")?x.pathname.slice(1):x.pathname.includes("/shorts/")?x.pathname.split("/shorts/")[1].split("/")[0]:x.searchParams.get("v")}catch{return null}}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function th(r){let y=yid(r.youtube_url);return y?`https://i.ytimg.com/vi/${y}/hqdefault.jpg`:""}
function reset(){form.reset();$("id").value="";$("uploadProgress").textContent="";document.querySelectorAll("#members input").forEach(x=>x.checked=false);toggleSource()}
function toggleSource(){let up=$("sourceType").value==="upload";$("youtubeFields").classList.toggle("hidden",up);$("uploadFields").classList.toggle("hidden",!up);$("url").required=!up}
async function ensureRoom(){let {data,error}=await sb.from("rooms").select("*").order("created_at").limit(1);if(error)throw error;if(!data?.length)throw new Error("コレクションルームが見つかりません。再ログインしてください。");room=data[0];$("roomname").textContent=room.name}
async function load(){let {data,error}=await sb.from("scenes").select("*").eq("room_id",room.id).order("updated_at",{ascending:false});if(error)throw error;rs=data||[];render()}
function render(){let q=$("q").value.toLowerCase(),sf=$("sf").value,a=rs.filter(r=>[r.title,r.description,r.chemistry,(r.members||[]).join(" "),(r.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)&&(!mf||(r.members||[]).includes(mf))&&(!sf||r.source_type===sf)&&(!fo||r.favorite));$("count").textContent=`${a.length}シーン / 全${rs.length}シーン`;$("grid").innerHTML=a.length?a.map(r=>`<div class="card"><div class="thumb" onclick="watch('${r.id}')">${r.source_type==="youtube"&&th(r)?`<img src="${esc(th(r))}">`:"▶"}</div><div class="body"><div class="title">${r.favorite?"★ ":""}${esc(r.title)}</div><div class="meta">${esc((r.members||[]).join(" / "))}${r.chemistry?" · "+esc(r.chemistry):""}</div><div class="desc">${esc(r.description||"")}</div><div class="tags">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="actions"><button onclick="watch('${r.id}')">▶ 見る</button>${r.source_type==="youtube"?`<button onclick="orig('${r.id}')">YouTube ↗</button>`:""}<button onclick="editR('${r.id}')">編集</button><button class="danger" onclick="removeR('${r.id}')">削除</button></div></div></div>`).join(""):`<div class="empty">シーンがありません</div>`}
async function signed(path){let {data,error}=await sb.storage.from("scene-videos").createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
async function watch(id){let r=rs.find(x=>x.id===id);try{if(r.source_type==="youtube"){let y=yid(r.youtube_url);$("viewer").innerHTML=y?`<iframe class="player" src="https://www.youtube.com/embed/${y}?start=${r.start_seconds||0}${r.end_seconds?`&end=${r.end_seconds}`:""}&autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe><h2>${esc(r.title)}</h2>`:`<h2>${esc(r.title)}</h2>`}else{let u=await signed(r.storage_path);$("viewer").innerHTML=`<video class="player" src="${esc(u)}" controls autoplay playsinline></video><h2>${esc(r.title)}</h2>`}view.showModal()}catch(e){alert("再生できません: "+e.message)}}
function orig(id){let r=rs.find(x=>x.id===id),u=r.youtube_url;if(r.start_seconds){try{let x=new URL(u);x.searchParams.set("t",r.start_seconds+"s");u=x.toString()}catch{}}window.open(u,"_blank")}
function editR(id){let r=rs.find(x=>x.id===id);reset();$("id").value=r.id;$("title").value=r.title||"";$("description").value=r.description||"";$("chemistry").value=r.chemistry||"";$("date").value=r.scene_date||"";$("sourceType").value=r.source_type;$("url").value=r.youtube_url||"";$("start").value=fmtSecs(r.start_seconds);$("end").value=fmtSecs(r.end_seconds);$("tags").value=(r.tags||[]).join(", ");$("favorite").value=String(!!r.favorite);document.querySelectorAll("#members input").forEach(x=>x.checked=(r.members||[]).includes(x.value));toggleSource();dlg.showModal()}
async function removeR(id){let r=rs.find(x=>x.id===id);if(!confirm("削除しますか？"))return;try{if(r.storage_path)await sb.storage.from("scene-videos").remove([r.storage_path]);let {error}=await sb.from("scenes").delete().eq("id",id);if(error)throw error;await load()}catch(e){alert("削除できません: "+e.message)}}
async function saveScene(e){e.preventDefault();$("saveBtn").disabled=true;try{let id=$("id").value||crypto.randomUUID(),old=rs.find(x=>x.id===id)||{},type=$("sourceType").value,path=old.storage_path||null;if(type==="upload"){let f=$("videoFile").files[0];if(!path&&!f)throw new Error("動画ファイルを選択してください。");if(f){if(f.size>50*1024*1024)throw new Error("動画は50MB以下にしてください。");let ext=(f.name.split(".").pop()||"mp4").replace(/[^a-zA-Z0-9]/g,"");path=`${room.id}/${id}/${crypto.randomUUID()}.${ext}`;$("uploadProgress").textContent="動画をアップロード中…";let {error}=await sb.storage.from("scene-videos").upload(path,f,{contentType:f.type||"video/mp4"});if(error)throw error;if(old.storage_path&&old.storage_path!==path)await sb.storage.from("scene-videos").remove([old.storage_path])}}else if(old.storage_path){await sb.storage.from("scene-videos").remove([old.storage_path]);path=null}
let row={id,room_id:room.id,created_by:old.created_by||user.id,source_type:type,title:$("title").value.trim(),description:$("description").value.trim(),youtube_url:type==="youtube"?$("url").value.trim():null,start_seconds:type==="youtube"?secs($("start").value):null,end_seconds:type==="youtube"?secs($("end").value)||null:null,storage_path:path,members:[...document.querySelectorAll("#members input:checked")].map(x=>x.value),chemistry:$("chemistry").value.trim(),tags:$("tags").value.split(/[,、]/).map(x=>x.trim()).filter(Boolean),scene_date:$("date").value||null,favorite:$("favorite").value==="true",updated_at:new Date().toISOString()};
let {error}=await sb.from("scenes").upsert(row);if(error)throw error;dlg.close();await load()}catch(e){alert("保存できません: "+e.message)}finally{$("saveBtn").disabled=false;$("uploadProgress").textContent=""}}
async function openOldDb(){return new Promise((res,rej)=>{let r=indexedDB.open("skz-scene-vault",1);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function oldRows(){let d=await openOldDb();return new Promise(res=>{let r=d.transaction("scenes").objectStore("scenes").getAll();r.onsuccess=()=>res(r.result||[])})}
async function migrateOld(){try{let old=await oldRows();if(!old.length)return alert("この端末に旧データはありません。");if(!confirm(`${old.length}件をクラウドへ移行しますか？`))return;for(let x of old){let id=(String(x.id||"").match(/^[0-9a-f-]{36}$/i)?x.id:crypto.randomUUID());let desc=[x.description,x.event?`番組・イベント: ${x.event}`:""].filter(Boolean).join("\n");let row={id,room_id:room.id,created_by:user.id,source_type:"youtube",title:x.title||"無題",description:desc,youtube_url:x.url||null,start_seconds:secs(x.start),end_seconds:secs(x.end)||null,storage_path:null,members:x.members||[],chemistry:x.chemistry||"",tags:x.tags||[],scene_date:x.date||null,favorite:!!x.favorite,updated_at:new Date().toISOString()};let {error}=await sb.from("scenes").upsert(row);if(error)throw error}await load();alert(`${old.length}件を移行しました。旧データは端末内にも残しています。`)}catch(e){alert("移行できません: "+e.message)}}
function downloadBackup(){let b=new Blob([JSON.stringify({version:2,scenes:rs},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="skz-collection-cloud-backup.json";a.click();URL.revokeObjectURL(a.href)}
async function restoreJson(file){try{let j=JSON.parse(await file.text()),arr=j.scenes||[];for(let x of arr){let oldStyle=!!x.url;let id=(String(x.id||"").match(/^[0-9a-f-]{36}$/i)?x.id:crypto.randomUUID());let row={id,room_id:room.id,created_by:user.id,source_type:x.source_type||(oldStyle?"youtube":"youtube"),title:x.title||"無題",description:[x.description,x.event?`番組・イベント: ${x.event}`:""].filter(Boolean).join("\n"),youtube_url:x.youtube_url||x.url||null,start_seconds:x.start_seconds??secs(x.start),end_seconds:x.end_seconds??(secs(x.end)||null),storage_path:x.storage_path||null,members:x.members||[],chemistry:x.chemistry||"",tags:x.tags||[],scene_date:x.scene_date||x.date||null,favorite:!!x.favorite,updated_at:new Date().toISOString()};let {error}=await sb.from("scenes").upsert(row);if(error)throw error}await load();alert(`${arr.length}件を復元しました。`)}catch(e){alert("復元できません: "+e.message)}}
async function showSession(session){user=session?.user||null;$("auth").classList.toggle("hidden",!!user);$("app").classList.toggle("hidden",!user);if(user){$("useremail").textContent=user.email||"";try{await ensureRoom();await load()}catch(e){alert(e.message)}}}
$("members").innerHTML=MS.map(m=>`<label><input type="checkbox" value="${m}"> ${m}</label>`).join("");$("chips").innerHTML=`<button class="chip on" data-m="">全員</button>`+MS.map(m=>`<button class="chip" data-m="${m}">${m}</button>`).join("");
$("chips").onclick=e=>{if(e.target.dataset.m===undefined)return;mf=e.target.dataset.m;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.m===mf));render()};$("add").onclick=()=>{reset();dlg.showModal()};$("q").oninput=render;$("sf").onchange=render;$("fav").onclick=()=>{fo=!fo;$("fav").textContent=fo?"★ お気に入りのみ":"♡ お気に入り";render()};$("sourceType").onchange=toggleSource;$("form").onsubmit=saveScene;$("migrate").onclick=migrateOld;$("backup").onclick=downloadBackup;$("restore").onclick=()=>$("restoreFile").click();$("restoreFile").onchange=e=>e.target.files[0]&&restoreJson(e.target.files[0]);$("logout").onclick=()=>sb.auth.signOut();
$("login").onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("authmsg").textContent=error?error.message:""};$("signup").onclick=async()=>{let {data,error}=await sb.auth.signUp({email:$("email").value.trim(),password:$("password").value});$("authmsg").textContent=error?error.message:(data.session?"登録しました。":"登録メールを確認してからログインしてください。")};
sb.auth.onAuthStateChange((event,session)=>setTimeout(()=>showSession(session),0));(async()=>{let {data}=await sb.auth.getSession();await showSession(data.session)})();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js");
</script></body></html>
