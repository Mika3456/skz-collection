<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKZ Scene Vault</title><meta name="theme-color" content="#0d0f13"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#0d0f13;--card:#171a21;--line:#2b303b;--text:#f4f5f7;--muted:#9ba3b4;--accent:#e8ff54}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{position:sticky;top:0;z-index:5;background:#0d0f13ee;padding:14px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px}.search,.toolbar,.actions,.chips{display:flex;gap:8px}.search input{flex:1}input,textarea,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#11141a;color:var(--text);padding:11px}button{cursor:pointer}.primary{background:var(--accent);color:#10110b;border:0;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:14px}.toolbar{flex-wrap:wrap;margin-bottom:14px}.chips{overflow:auto;padding-bottom:12px}.chip{white-space:nowrap;border-radius:999px}.chip.on{background:var(--accent);color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.thumb{aspect-ratio:16/9;background:#08090c;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:11px}.title{font-weight:800}.meta,.desc,.count{font-size:13px;color:var(--muted)}.desc{margin:7px 0;color:#d9dce3}.tag{font-size:11px;background:#252a34;padding:4px 7px;border-radius:999px}.tags{display:flex;flex-wrap:wrap;gap:5px}.actions{flex-wrap:wrap;margin-top:9px}.actions button{padding:8px;font-size:12px}dialog{width:min(680px,calc(100% - 20px));border:1px solid var(--line);border-radius:16px;background:#12151b;color:var(--text);padding:16px}dialog::backdrop{background:#000a}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%}.members{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.members label{background:#1d222b;padding:8px;border-radius:9px;font-size:12px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.player{width:100%;aspect-ratio:16/9;border:0}.empty{text-align:center;color:var(--muted);padding:50px}.count{margin:8px 0 12px}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.members{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>SKZ Scene Vault</h1><div class="search"><input id="q" placeholder="メンバー・ケミ・シーン内容・タグを検索"><button class="primary" id="add">＋追加</button></div></header>
<div class="wrap"><div class="chips" id="chips"></div><div class="toolbar"><select id="sf"><option value="">すべての動画元</option><option>YouTube</option><option>X</option><option>Instagram</option><option>TikTok</option><option>その他</option></select><button id="fav">♡ お気に入り</button><button id="backup">バックアップ</button><button id="restore">復元</button><input type="file" id="file" accept=".json" hidden></div><div class="count" id="count"></div><div class="grid" id="grid"></div></div>
<dialog id="dlg"><form id="form"><h2>シーン登録</h2><input type="hidden" id="id"><div class="field"><label>タイトル *</label><input id="title" required></div><div class="field"><label>登場メンバー</label><div class="members" id="members"></div></div><div class="field"><label>シーン内容・検索用メモ</label><textarea id="description" rows="3"></textarea></div><div class="field"><label>ケミ</label><input id="chemistry"></div><div class="field"><label>タグ（カンマ区切り）</label><input id="tags"></div><div class="field"><label>番組・イベント</label><input id="event"></div><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>動画元</label><select id="source"><option>YouTube</option><option>X</option><option>Instagram</option><option>TikTok</option><option>その他</option></select></div><div class="field"><label>元動画URL *</label><input id="url" type="url" required></div><div class="field"><label>開始位置（例 12:34）</label><input id="start"></div><div class="field"><label>終了位置</label><input id="end"></div><div class="field"><label>サムネイルURL（YouTubeは自動）</label><input id="thumbnail" type="url"></div><div class="field"><label>お気に入り</label><select id="favorite"><option value="false">通常</option><option value="true">★ お気に入り</option></select></div><div class="footer"><button type="button" onclick="dlg.close()">キャンセル</button><button class="primary">保存</button></div></form></dialog>
<dialog id="view"><div id="viewer"></div><div class="footer"><button onclick="view.close()">閉じる</button></div></dialog>
<script>
const MS=["Bang Chan","Lee Know","Changbin","Hyunjin","HAN","Felix","Seungmin","I.N"];let db,rs=[],mf="",fo=false,$=x=>document.getElementById(x);
function odb(){return new Promise((a,b)=>{let r=indexedDB.open("skz-scene-vault",1);r.onupgradeneeded=()=>r.result.createObjectStore("scenes",{keyPath:"id"});r.onsuccess=()=>{db=r.result;a()};r.onerror=()=>b(r.error)})}function getall(){return new Promise(a=>{let r=db.transaction("scenes").objectStore("scenes").getAll();r.onsuccess=()=>a(r.result)})}function put(x){return new Promise(a=>{let r=db.transaction("scenes","readwrite").objectStore("scenes").put(x);r.onsuccess=a})}function del(x){return new Promise(a=>{let r=db.transaction("scenes","readwrite").objectStore("scenes").delete(x);r.onsuccess=a})}
function secs(v){return(v||"").split(":").reduce((n,x)=>n*60+(+x||0),0)}function yid(u){try{let x=new URL(u);return x.hostname.includes("youtu.be")?x.pathname.slice(1):x.pathname.includes("/shorts/")?x.pathname.split("/shorts/")[1].split("/")[0]:x.searchParams.get("v")}catch{return null}}function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function th(r){let y=yid(r.url);return r.thumbnail||(y?`https://i.ytimg.com/vi/${y}/hqdefault.jpg`:"")}
function render(){let q=$("q").value.toLowerCase(),sf=$("sf").value,a=rs.filter(r=>[r.title,r.description,r.chemistry,r.event,(r.members||[]).join(" "),(r.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)&&(!mf||(r.members||[]).includes(mf))&&(!sf||r.source===sf)&&(!fo||r.favorite));$("count").textContent=`${a.length}シーン / 全${rs.length}シーン`;$("grid").innerHTML=a.length?a.sort((x,y)=>(y.updated||0)-(x.updated||0)).map(r=>`<div class="card"><div class="thumb" onclick="watch('${r.id}')">${th(r)?`<img src="${esc(th(r))}">`:"▶"}</div><div class="body"><div class="title">${r.favorite?"★ ":""}${esc(r.title)}</div><div class="meta">${esc((r.members||[]).join(" / "))}${r.chemistry?" · "+esc(r.chemistry):""}</div><div class="desc">${esc(r.description||"")}</div><div class="tags">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="actions"><button onclick="watch('${r.id}')">▶ 見る</button><button onclick="orig('${r.id}')">元動画 ↗</button><button onclick="edit('${r.id}')">編集</button><button onclick="removeR('${r.id}')">削除</button></div></div></div>`).join(""):`<div class="empty">シーンがありません</div>`}
function reset(){form.reset();$("id").value="";document.querySelectorAll("#members input").forEach(x=>x.checked=false)}function edit(id){let r=rs.find(x=>x.id===id);reset();["id","title","description","chemistry","event","date","source","url","start","end","thumbnail"].forEach(k=>$(k).value=r[k]||"");$("tags").value=(r.tags||[]).join(", ");$("favorite").value=String(!!r.favorite);document.querySelectorAll("#members input").forEach(x=>x.checked=(r.members||[]).includes(x.value));dlg.showModal()}
function orig(id){let r=rs.find(x=>x.id===id),u=r.url;if(r.source==="YouTube"&&secs(r.start)){try{let x=new URL(u);x.searchParams.set("t",secs(r.start)+"s");u=x.toString()}catch{}}window.open(u,"_blank")}
function watch(id){let r=rs.find(x=>x.id===id),y=yid(r.url);$("viewer").innerHTML=y?`<iframe class="player" src="https://www.youtube.com/embed/${y}?start=${secs(r.start)}${secs(r.end)?`&end=${secs(r.end)}`:""}&autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe><h2>${esc(r.title)}</h2><button onclick="orig('${id}')">元動画へ ↗</button>`:`<h2>${esc(r.title)}</h2><button class="primary" onclick="orig('${id}')">元動画で再生</button>`;view.showModal()}
async function removeR(id){if(confirm("削除しますか？")){await del(id);rs=await getall();render()}}
$("members").innerHTML=MS.map(m=>`<label><input type="checkbox" value="${m}"> ${m}</label>`).join("");$("chips").innerHTML=`<button class="chip on" data-m="">全員</button>`+MS.map(m=>`<button class="chip" data-m="${m}">${m}</button>`).join("");$("chips").onclick=e=>{if(e.target.dataset.m===undefined)return;mf=e.target.dataset.m;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.m===mf));render()};$("add").onclick=()=>{reset();dlg.showModal()};$("q").oninput=render;$("sf").onchange=render;$("fav").onclick=()=>{fo=!fo;render()};
$("form").onsubmit=async e=>{e.preventDefault();let id=$("id").value||crypto.randomUUID(),old=rs.find(x=>x.id===id)||{},r={...old,id,title:$("title").value.trim(),description:$("description").value.trim(),chemistry:$("chemistry").value.trim(),event:$("event").value.trim(),date:$("date").value,source:$("source").value,url:$("url").value.trim(),start:$("start").value.trim(),end:$("end").value.trim(),thumbnail:$("thumbnail").value.trim(),favorite:$("favorite").value==="true",members:[...document.querySelectorAll("#members input:checked")].map(x=>x.value),tags:$("tags").value.split(/[,、]/).map(x=>x.trim()).filter(Boolean),updated:Date.now()};await put(r);rs=await getall();dlg.close();render()};
$("backup").onclick=()=>{let b=new Blob([JSON.stringify({version:1,scenes:rs},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="skz-scene-vault-backup.json";a.click()};$("restore").onclick=()=>$("file").click();$("file").onchange=async e=>{let j=JSON.parse(await e.target.files[0].text());for(let r of(j.scenes||[]))await put(r);rs=await getall();render();alert("復元しました")};
(async()=>{await odb();rs=await getall();render()})();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js");
</script></body></html>
